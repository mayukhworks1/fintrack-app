# Alembic configuration. The database URL is NOT set here: migrations/env.py
# reads it from app settings (POSTGRES_URL) so there is exactly one source of
# truth and no credential ever lands in a config file.
[alembic]
script_location = migrations
prepend_sys_path = .
# Revision files are named by sequence so `ls versions/` reads in order.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
