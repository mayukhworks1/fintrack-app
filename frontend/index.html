<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon & PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme colour (matches --accent blue in light mode) -->
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e3a8a" media="(prefers-color-scheme: dark)" />

    <!-- SEO / social -->
    <meta name="description" content="AI-powered project finance management — track projects, invoices, and client budgets in real time." />
    <meta name="application-name" content="FinTrack" />
    <meta property="og:title" content="FinTrack — AI Project Finance Manager" />
    <meta property="og:description" content="AI-powered project finance management — track projects, invoices, and client budgets in real time." />
    <meta property="og:type" content="website" />

    <title>FinTrack — AI Project Finance Manager</title>

    <!-- Typography — Outfit variable font, self-hosted (see src/index.css).
         Preloaded so text paints in the real face on first frame instead of
         swapping in after a round trip. Both subsets are preloaded: latin
         carries the UI text and latin-ext carries the rupee sign, which is
         above the fold in every KPI tile. 47 KB for the full 100-900 axis. -->
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit-latin-ext.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Cloudflare Web Analytics -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token":"61e6a2eca988429ba09a654faadbc31d"}'></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
