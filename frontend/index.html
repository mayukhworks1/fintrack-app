<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon & PWA.
         apple-touch-icon must be a PNG: iOS ignores SVG here, which is why
         adding FinTrack to a home screen used to produce a blank icon. It is
         also full-bleed and square on purpose — iOS applies its own rounded
         mask, so a pre-rounded source would be rounded twice. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Theme colour (matches --accent blue in light mode) -->
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e3a8a" media="(prefers-color-scheme: dark)" />

    <!-- SEO / social -->
    <meta name="description" content="AI-powered project finance management — track projects, invoices, and client budgets in real time." />
    <meta name="application-name" content="FinTrack" />
    <meta property="og:title" content="FinTrack — AI Project Finance Manager" />
    <meta property="og:description" content="AI-powered project finance management — track projects, invoices, and client budgets in real time." />
    <meta property="og:type" content="website" />
    <!-- Absolute URL: WhatsApp, Slack and Twitter fetch this without a page
         context, so a relative path is not resolved. Update the host here if
         the domain changes. -->
    <meta property="og:url" content="https://twfintracker.worksmayukh.space/" />
    <meta property="og:image" content="https://twfintracker.worksmayukh.space/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FinTrack — AI-powered project finance" />
    <meta property="og:site_name" content="FinTrack" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FinTrack — AI Project Finance Manager" />
    <meta name="twitter:description" content="AI-powered project finance management — track projects, invoices, and client budgets in real time." />
    <meta name="twitter:image" content="https://twfintracker.worksmayukh.space/og-image.png" />

    <title>FinTrack — AI Project Finance Manager</title>

    <!-- Typography — Outfit variable font, self-hosted (see src/index.css).
         Preloaded so text paints in the real face on first frame instead of
         swapping in after a round trip. Both subsets are preloaded: latin
         carries the UI text and latin-ext carries the rupee sign, which is
         above the fold in every KPI tile. 47 KB for the full 100-900 axis. -->
    <link rel="preload" href="/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Fraunces carries every display heading, including the one above the
         fold, so it is preloaded too. Its latin-ext subset is not:
         unicode-range means the browser fetches that only if a glyph in
         the block is actually set. -->
    <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The wordmark. It is the first thing on every page — header, sidebar,
         login — so a swap would be the logo visibly changing shape after
         paint, which is the one place a swap is not acceptable. It costs
         2.1 KB because it is cut to the eight letters of "FinTrack" and
         nothing else, so preloading it is cheaper than the flash. -->
    <link rel="preload" href="/fonts/jost-wordmark.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Cloudflare Web Analytics -->
    <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token":"61e6a2eca988429ba09a654faadbc31d"}'></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
