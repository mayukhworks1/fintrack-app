<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- FinTrack mark — an "F" whose arms read as the bars of a horizontal chart,
       longest on top. Keep in sync with src/components/BrandMark.jsx. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E2848"/>
      <stop offset="1" stop-color="#080C18"/>
    </linearGradient>
    <linearGradient id="accent" x1="9" y1="7.6" x2="24.4" y2="6" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F86FF"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="9" fill="url(#bg)"/>
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="8.5" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.2"/>
  <rect x="9" y="6" width="3.3" height="20" rx="1.65" fill="#fff"/>
  <rect x="9" y="6" width="15.4" height="3.3" rx="1.65" fill="url(#accent)"/>
  <rect x="9" y="13.6" width="10.2" height="3.3" rx="1.65" fill="#fff" opacity=".9"/>
</svg>
