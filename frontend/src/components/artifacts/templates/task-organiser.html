<style>

  --app-w:760px;

@media (prefers-color-scheme:dark){:root{
  --bg:#0c0d10;--surface:#15171c;--surface-2:#1c1f26;--raised:#272b35;
  --border:#262a33;--border-strong:#373c48;
  --text:#eceef2;--text-2:#a9afbc;--text-3:#808797;
  --accent:#818cf8;--accent-hover:#a5b4fc;--accent-soft:#1f2040;--accent-text:#b4bcff;--on-accent:#0b0c1a;
  --success:#4ade80;--success-soft:#0f2a1b;--warning:#fbbf24;--warning-soft:#2b2210;

*,*::before,*::after{box-sizing:border-box}

.input:hover,.select:hover,.textarea:hover{border-color:var(--text-3)}
.input:focus-visible,.select:focus-visible,.textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:var(--ring)}

.input-group{position:relative;display:flex;align-items:center;min-width:0}
.input-group>.icon,.input-group>.prefix{position:absolute;left:12px;color:var(--text-3);pointer-events:none}
.input-group>.input{padding-left:36px}

.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r)}

.list{margin:0;padding:0;list-style:none}

.row:hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:500;overflow-wrap:anywhere}
.row-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:3px;font-size:.75rem;color:var(--text-3)}

.chip:hover{border-color:var(--text-3)}
.chip[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg)}

.progress{height:6px;overflow:hidden;border-radius:var(--r-full);background:var(--surface-2)}
.progress>span{display:block;height:100%;border-radius:inherit;background:var(--accent);transition:width .3s var(--ease)}
.kbd{padding:1px 6px;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;background:var(--surface);color:var(--text-2);font:500 .6875rem/1.5 var(--font-mono)}
.divider{height:1px;margin:var(--s4) 0;border:0;background:var(--border)}

.app{--app-w:720px}
.header-meta{display:flex;align-items:center;gap:var(--s2)}
.progress-card{display:flex;align-items:center;gap:var(--s4);margin-bottom:var(--s4)}
.progress-card .progress{flex:1}
.progress-text{font-size:.8125rem;color:var(--text-2);white-space:nowrap}
.composer{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:var(--s2);align-items:center;padding:var(--s3);margin-bottom:var(--s4)}
.composer .input-group .input{border-color:transparent;box-shadow:none;background:transparent;padding-left:38px;font-size:.9375rem}

/* Phone (≤640px): a ring summary, All / Today / Upcoming, inset grouped rows
   (time · category, priority dot) and an inline "Add a task" row. Editing and
   adding happen in a bottom sheet. Wider screens keep the layout above. */

.ring{position:relative;display:grid;place-items:center;width:56px;height:56px;flex:none}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}

.ring b{position:relative;font-size:.8125rem;font-variant-numeric:tabular-nums}

.ring-text{margin-top:2px;font-size:.875rem;color:var(--text-2)}

.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.sheet-actions{display:flex;gap:var(--s2)}
.sheet-actions .btn{flex:1}

  .app-header>div:first-child{display:flex;flex-direction:column-reverse;min-width:0}
  .app-header h1{font-size:2rem;letter-spacing:-.03em}
  .subtitle{margin:0 0 2px;font-size:.875rem;color:var(--text-3)}
  .progress-card,.composer,.toolbar,.shortcuts{display:none}
  .ring-card{display:flex;align-items:center;gap:var(--s4);padding:var(--s4);margin-bottom:var(--s4);border:0}
  .seg-phone{display:flex;width:100%;margin-bottom:var(--s4)}

  .row-sub{display:block;margin-top:2px;font-size:.8125rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol><symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.2 6.8a2.8 2.8 0 0 0-4-4L3.8 16.2a2 2 0 0 0-.5.8l-1.3 4.4a.5.5 0 0 0 .6.6l4.4-1.3a2 2 0 0 0 .8-.5z"/><path d="m15 5 4 4"/></symbol><symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol><symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/></symbol><symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol><symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/></symbol><symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol></svg>
<main class="app">
  <header class="app-header">
    <div>
      <h1>Tasks</h1>
      <p class="subtitle" id="today"></p>
    </div>
    <div class="header-meta">
      <span class="badge" id="saved" role="status" aria-live="polite"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-check"/></svg><span>Connecting…</span></span>
    </div>
  </header>

  <section class="card ring-card" aria-label="Progress">
    <div class="ring" id="ring" role="img" aria-label="0% done">
      <svg viewBox="0 0 56 56" width="56" height="56" aria-hidden="true"><circle class="track" cx="28" cy="28" r="25.5"/><circle class="fill" cx="28" cy="28" r="25.5" stroke-dasharray="160.2" stroke-dashoffset="160.2"/></svg>
      <b id="ringPct">0%</b>
    </div>
    <div>
      <p class="ring-title num" id="ringTitle">0 of 0 done</p>
      <p class="ring-text" id="ringText">Add your first task</p>
    </div>
  </section>

  <div class="seg seg-phone" role="group" aria-label="Show">
    <button type="button" data-view="all" aria-pressed="true">All</button>
    <button type="button" data-view="today" aria-pressed="false">Today</button>
    <button type="button" data-view="upcoming" aria-pressed="false">Upcoming</button>
  </div>

  <section class="card progress-card" aria-label="Progress">
    <div class="progress" role="progressbar" aria-label="Tasks completed" aria-valuemin="0" aria-valuemax="100" id="bar"><span style="width:0"></span></div>
    <span class="progress-text num" id="progressText"></span>
  </section>

  <form class="card composer" id="composer" autocomplete="off">
    <div class="input-group">
      <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
      <label for="newTitle" class="sr-only">New task</label>
      <input class="input" id="newTitle" placeholder="Add a task and press Enter" maxlength="140">
    </div>
    <label for="newPrio" class="sr-only">Priority</label>
    <select class="select" id="newPrio">
      <option value="">No priority</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
    <label for="newDue" class="sr-only">Due date</label>
    <input class="input" type="date" id="newDue">
    <button class="btn btn-primary" type="submit">Add task</button>
  </form>

  <div class="toolbar">
    <div class="seg" role="group" aria-label="Show">
      <button type="button" data-filter="all" aria-pressed="true">All <span class="count" id="cAll">0</span></button>
      <button type="button" data-filter="active" aria-pressed="false">Active <span class="count" id="cActive">0</span></button>
      <button type="button" data-filter="done" aria-pressed="false">Done <span class="count" id="cDone">0</span></button>
    </div>
  </div>

  <section class="card card-flush list-card" aria-label="Tasks">
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden>
      <div class="empty-icon"><svg class="icon" aria-hidden="true"><use href="#i-inbox"/></svg></div>
      <h3 id="emptyTitle">Nothing here yet</h3>
      <p id="emptyText">Add your first task above. Press Enter to save it.</p>
    </div>
    <div class="card-footer">
      <span class="num" id="left">0 tasks left</span>
      <button type="button" class="btn btn-ghost btn-sm" id="clearDone"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-check-circle"/></svg>Clear completed</button>
    </div>
  </section>
  <button type="button" class="add-row" id="addRow"><span class="plus" aria-hidden="true"><svg class="icon icon-sm"><use href="#i-plus"/></svg></span>Add a task</button>
  <p class="shortcuts hide-sm"><span class="kbd">/</span> add a task &nbsp; <span class="kbd">Enter</span> save &nbsp; <span class="kbd">Alt</span>+<span class="kbd">↑</span><span class="kbd">↓</span> move &nbsp; <span class="kbd">Ctrl</span>+<span class="kbd">Z</span> undo &nbsp; double-click a task to edit</p>
</main>
<div class="toasts" id="toasts" aria-live="polite"></div>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <form id="sheetForm" method="dialog" autocomplete="off">
    <div class="sheet-head">
      <h2 id="sheetTitle">New task</h2>
      <button type="button" class="btn btn-icon" id="sheetClose" aria-label="Close" style="width:44px;height:44px"><svg class="icon" aria-hidden="true"><use href="#i-plus" style="transform:rotate(45deg);transform-origin:center"/></svg></button>
    </div>
    <div class="field">
      <label class="label" for="sTitle">Task</label>
      <input class="input" id="sTitle" maxlength="140" required>
    </div>
    <div class="grid" style="--min:130px;gap:var(--s3)">
      <div class="field"><label class="label" for="sDue">Due date</label><input class="input" type="date" id="sDue"></div>
      <div class="field"><label class="label" for="sTime">Time</label><input class="input" type="time" id="sTime"></div>
      <div class="field">
        <label class="label" for="sPrio">Priority</label>
        <select class="select" id="sPrio"><option value="">No priority</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select>
      </div>
      <div class="field">
        <label class="label" for="sCat">Category</label>
        <select class="select" id="sCat"><option value="">None</option><option>Work</option><option>Personal</option><option>Errands</option><option>Health</option><option>Home</option></select>
      </div>
    </div>
    <div class="sheet-actions">
      <button type="button" class="btn btn-secondary is-danger" id="sheetDelete" hidden><svg class="icon icon-sm" aria-hidden="true"><use href="#i-trash"/></svg>Delete</button>
      <button type="submit" class="btn btn-primary" id="sheetSave">Add task</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  // Tasks live in the artifact's shared cloud data (window.fintrack.db):
  // everyone with the link sees the same list, and every change, live.
  var db = window.fintrack.db;
  var col = db.collection('tasks');
  var DAY = 86400000;
  var $ = function (id) { return document.getElementById(id); };
  var fmtDate = new Intl.DateTimeFormat('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  var fmtShort = new Intl.DateTimeFormat('en-IN', { day: 'numeric', month: 'short' });
  var fmtTime = new Intl.DateTimeFormat('en-IN', { hour: 'numeric', minute: '2-digit', hour12: true });
  var phone = window.matchMedia('(max-width: 640px)');

  function iso(offsetDays) {
    var d = new Date(Date.now() + offsetDays * DAY);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  var tasks = [];
  var filter = 'all';
  var view = 'all';     // the phone's All / Today / Upcoming
  var sheetTask = null; // the task open in the sheet, or null for a new one
  var editing = null;
  var undoStack = [];

  function fromRecord(r) {
    var d = r.data || {};
    return { id: r.id, title: String(d.title || ''), done: !!d.done, prio: d.prio || '', due: d.due || '',
      time: d.time || '', cat: d.cat || '',
      order: typeof d.order === 'number' ? d.order : 0, pending: r.pending };
  }
  function fail(e) { toast(e && e.message ? e.message : 'That change did not save. Try again.', false); }

  var STATUS = {
    connecting: ['badge', 'Connecting…'], synced: ['badge badge-success', 'Synced'],
    syncing: ['badge badge-warning', 'Saving…'], offline: ['badge badge-warning', 'Offline · will sync'],
    local: ['badge', 'Not shared (preview)']
  };
  db.onStatus(function (st) {
    var b = $('saved'), v = STATUS[st] || STATUS.connecting;
    b.className = v[0];
    b.lastElementChild.textContent = v[1];
  });

  function dueInfo(due) {
    if (!due) return null;
    var today = new Date(iso(0) + 'T00:00:00');
    var d = new Date(due + 'T00:00:00');
    if (isNaN(d)) return null;
    var diff = Math.round((d - today) / DAY);
    var label = diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow' : diff === -1 ? 'Yesterday' : fmtShort.format(d);
    return { label: label, overdue: diff < 0, soon: diff >= 0 && diff <= 1, full: fmtDate.format(d) };
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function icon(name, small) {
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'icon' + (small ? ' icon-sm' : ''));
    svg.setAttribute('aria-hidden', 'true');
    var use = document.createElementNS(ns, 'use');
    use.setAttribute('href', '#i-' + name);
    svg.appendChild(use);
    return svg;
  }

  // "4:00 pm" for a task's time (HH:MM), or ''.
  function timeLabel(time) {
    if (!/^\d{2}:\d{2}$/.test(time || '')) return '';
    var hm = time.split(':');
    return fmtTime.format(new Date(2000, 0, 1, +hm[0], +hm[1])).replace(/\s?([ap])\.?m\.?$/i, function (_, x) { return ' ' + x.toLowerCase() + 'm'; });
  }
  // The phone's second line: when, then the category ("5:00 pm · Work").
  function subLine(t) {
    var parts = [];
    var info = dueInfo(t.due);
    var at = timeLabel(t.time);
    if (t.done) parts.push('Done');
    else if (info) {
      if (info.overdue) parts.push('Overdue · ' + info.label);
      else parts.push(info.label === 'Today' && at ? at : info.label + (at ? ' ' + at : ''));
    } else if (at) parts.push(at);
    if (t.cat) parts.push(t.cat);
    return parts.join(' · ');
  }
  function inView(t) {
    if (view === 'all') return true;
    var today = iso(0);
    if (view === 'today') return !!t.due && t.due <= today && !(t.done && t.due < today);
    return !!t.due && t.due > today;
  }
  function visible() {
    if (phone.matches) return tasks.filter(inView);
    return tasks.filter(function (t) { return filter === 'all' || (filter === 'done' ? t.done : !t.done); });
  }
  // The ring's sentence: what is left, how much of it is today, and what is next.
  function summary() {
    var today = iso(0);
    var open = tasks.filter(function (t) { return !t.done; });
    var dueToday = open.filter(function (t) { return t.due && t.due <= today; });
    var next = dueToday.filter(function (t) { return t.due === today && t.time; })
      .sort(function (a, b) { return a.time < b.time ? -1 : 1; })[0];
    if (!tasks.length) return 'Add your first task';
    if (!open.length) return 'All done · nothing left';
    var bits = [open.length + ' left'];
    if (dueToday.length) bits.push(dueToday.length + ' today' + (next ? ', next at ' + timeLabel(next.time) : ''));
    else {
      var soon = open.filter(function (t) { return t.due; }).sort(function (a, b) { return a.due < b.due ? -1 : 1; })[0];
      if (soon) bits.push('next due ' + dueInfo(soon.due).label);
    }
    return bits.join(' · ');
  }

  function render() {
    var list = $('list');
    list.textContent = '';
    var shown = visible();
    shown.forEach(function (t) { list.appendChild(row(t)); });

    var done = tasks.filter(function (t) { return t.done; }).length;
    var active = tasks.length - done;
    $('cAll').textContent = tasks.length;
    $('cActive').textContent = active;
    $('cDone').textContent = done;
    $('left').textContent = active === 1 ? '1 task left' : active + ' tasks left';
    $('clearDone').disabled = done === 0;
    var pct = tasks.length ? Math.round(done / tasks.length * 100) : 0;
    $('bar').firstElementChild.style.width = pct + '%';
    $('bar').setAttribute('aria-valuenow', pct);
    $('progressText').textContent = done + ' of ' + tasks.length + ' done';
    var ring = $('ring');
    ring.querySelector('.fill').setAttribute('stroke-dashoffset', String(160.2 * (1 - pct / 100)));
    ring.setAttribute('aria-label', pct + '% done');
    $('ringPct').textContent = pct + '%';
    $('ringTitle').textContent = done + ' of ' + tasks.length + ' done';
    $('ringText').textContent = summary();

    var empty = $('empty');
    empty.hidden = shown.length > 0;
    if (!shown.length) {
      if (phone.matches && view !== 'all') {
        $('emptyTitle').textContent = view === 'today' ? 'Nothing due today' : 'Nothing coming up';
        $('emptyText').textContent = 'Tasks with a due date show up here. Add one below.';
      } else {
      $('emptyTitle').textContent = filter === 'done' ? 'Nothing finished yet' : filter === 'active' && tasks.length ? 'All caught up' : 'Nothing here yet';
      $('emptyText').textContent = filter === 'done' ? 'Tick a task when it is done and it will show up here.'
        : filter === 'active' && tasks.length ? 'Every task is done. Enjoy the quiet, or add the next one above.'
        : 'Add your first task above. Press Enter to save it.';
      }
    }
    list.hidden = !shown.length;
  }

  function row(t) {
    var li = el('li', 'row task' + (t.done ? ' done' : ''));
    li.dataset.id = t.id;

    var grip = el('button', 'btn btn-icon grip');
    grip.type = 'button';
    grip.setAttribute('aria-label', 'Move "' + t.title + '" (Alt+Up or Alt+Down)');
    grip.title = 'Drag to reorder';
    grip.appendChild(icon('grip', true));
    grip.draggable = true;
    li.appendChild(grip);

    var box = el('input', 'check round');
    box.type = 'checkbox';
    box.checked = t.done;
    box.id = 'c-' + t.id;
    box.setAttribute('aria-label', (t.done ? 'Mark not done: ' : 'Mark done: ') + t.title);
    box.addEventListener('change', function () { col.update(t.id, { done: box.checked }).catch(fail); });
    li.appendChild(box);

    var main = el('div', 'row-main');
    if (editing === t.id) {
      var input = el('input', 'input edit');
      input.value = t.title;
      input.setAttribute('aria-label', 'Edit task');
      input.maxLength = 140;
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); commit(t, input.value); }
        if (e.key === 'Escape') { e.preventDefault(); editing = null; render(); focusRow(t.id); }
      });
      input.addEventListener('blur', function () { if (editing === t.id) commit(t, input.value); });
      main.appendChild(input);
    } else {
      var title = el('div', 'row-title', t.title);
      title.addEventListener('dblclick', function () { startEdit(t.id); });
      main.appendChild(title);
      var info = dueInfo(t.due);
      main.appendChild(el('span', 'row-sub', subLine(t)));
      if (info || t.prio || t.cat) {
        var meta = el('div', 'row-meta');
        if (info) {
          var due = el('span', 'badge ' + (t.done ? '' : info.overdue ? 'badge-danger' : info.soon ? 'badge-warning' : ''));
          due.title = (info.overdue && !t.done ? 'Overdue, was due ' : 'Due ') + info.full;
          due.appendChild(icon('calendar', true));
          var when = info.label + (t.time ? ' ' + timeLabel(t.time) : '');
          due.appendChild(document.createTextNode(info.overdue && !t.done ? 'Overdue · ' + when : when));
          due.querySelector('svg').style.cssText = 'width:12px;height:12px';
          meta.appendChild(due);
        }
        if (t.prio) {
          var p = el('span', 'cluster');
          p.style.setProperty('--gap', '6px');
          p.appendChild(el('span', 'prio p-' + t.prio));
          p.appendChild(document.createTextNode(t.prio.charAt(0).toUpperCase() + t.prio.slice(1) + ' priority'));
          meta.appendChild(p);
        }
        if (t.cat) meta.appendChild(el('span', 'badge', t.cat));
        main.appendChild(meta);
      }
    }
    li.appendChild(main);

    // Phone: a priority dot at the end of the row; tapping the row opens it.
    var dot = el('span', 'row-dot' + (t.prio ? ' prio p-' + t.prio : ''));
    if (t.prio) { dot.setAttribute('role', 'img'); dot.setAttribute('aria-label', t.prio + ' priority'); } else dot.setAttribute('aria-hidden', 'true');
    li.appendChild(dot);
    li.addEventListener('click', function (e) {
      if (!phone.matches || editing === t.id || e.target.closest('input,button')) return;
      openSheet(t);
    });

    var actions = el('div', 'row-actions');
    var edit = el('button', 'btn btn-icon');
    edit.type = 'button';
    edit.setAttribute('aria-label', 'Edit "' + t.title + '"');
    edit.title = 'Edit';
    edit.appendChild(icon('pencil', true));
    edit.addEventListener('click', function () { startEdit(t.id); });
    var del = el('button', 'btn btn-icon is-danger');
    del.type = 'button';
    del.setAttribute('aria-label', 'Delete "' + t.title + '"');
    del.title = 'Delete';
    del.appendChild(icon('trash', true));
    del.addEventListener('click', function () { remove(t.id); });
    actions.appendChild(edit);
    actions.appendChild(del);
    li.appendChild(actions);

    // Drag to reorder, from the handle.
    grip.addEventListener('dragstart', function (e) {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', t.id);
      e.dataTransfer.setDragImage(li, 20, 20);
      li.classList.add('dragging');
    });
    grip.addEventListener('dragend', function () { li.classList.remove('dragging'); clearDrop(); });
    li.addEventListener('dragover', function (e) {
      e.preventDefault();
      clearDrop();
      var r = li.getBoundingClientRect();
      li.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
    });
    li.addEventListener('drop', function (e) {
      e.preventDefault();
      var id = e.dataTransfer.getData('text/plain');
      var after = li.classList.contains('drop-after');
      clearDrop();
      moveTo(id, t.id, after);
    });
    grip.addEventListener('keydown', function (e) {
      if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); nudge(t.id, e.key === 'ArrowUp' ? -1 : 1); }
    });
    return li;
  }

  function clearDrop() {
    document.querySelectorAll('.drop-before,.drop-after').forEach(function (n) { n.classList.remove('drop-before', 'drop-after'); });
  }
  // Order is a number per task; a move takes the midpoint of its new neighbours.
  function moveTo(id, targetId, after) {
    if (!id || id === targetId) return;
    var rest = tasks.filter(function (t) { return t.id !== id; });
    var to = rest.findIndex(function (t) { return t.id === targetId; });
    if (to < 0) return;
    var at = after ? to + 1 : to;
    var prev = rest[at - 1], next = rest[at];
    var order = prev && next ? (prev.order + next.order) / 2 : prev ? prev.order + 1 : next ? next.order - 1 : 0;
    col.update(id, { order: order }).catch(fail);
  }
  function nudge(id, dir) {
    var shown = visible();
    var i = shown.findIndex(function (t) { return t.id === id; });
    var other = shown[i + dir];
    if (!other) return;
    moveTo(id, other.id, dir > 0);
    var g = document.querySelector('[data-id="' + id + '"] .grip');
    if (g) g.focus();
    announce('Moved ' + (dir < 0 ? 'up' : 'down'));
  }
  function focusRow(id) {
    var n = document.querySelector('[data-id="' + id + '"] .check');
    if (n) n.focus();
  }
  function startEdit(id) {
    editing = id;
    render();
    var input = document.querySelector('[data-id="' + id + '"] .edit');
    if (input) { input.focus(); input.select(); }
  }
  function commit(t, value) {
    var v = value.trim();
    editing = null;
    if (v && v !== t.title) col.update(t.id, { title: v }).catch(fail);
    render(); focusRow(t.id);
  }

  function data(t) { return { title: t.title, done: t.done, prio: t.prio, due: t.due, time: t.time, cat: t.cat, order: t.order }; }
  function remove(id) {
    var t = tasks.find(function (x) { return x.id === id; });
    if (!t) return;
    undoStack.push({ items: [data(t)] });
    col.remove(id).catch(fail);
    toast('Task deleted', true);
  }
  function clearCompleted() {
    var done = tasks.filter(function (t) { return t.done; });
    if (!done.length) return;
    undoStack.push({ items: done.map(data) });
    done.forEach(function (t) { col.remove(t.id).catch(fail); });
    toast(done.length === 1 ? '1 completed task cleared' : done.length + ' completed tasks cleared', true);
  }
  function undo() {
    var last = undoStack.pop();
    if (!last) return;
    last.items.forEach(function (d) { col.add(d).catch(fail); });
    toast('Restored', false);
  }

  function toast(text, withUndo) {
    var box = $('toasts');
    box.textContent = '';
    var t = el('div', 'toast');
    t.appendChild(el('span', '', text));
    if (withUndo) {
      var b = el('button', '', 'Undo');
      b.type = 'button';
      b.addEventListener('click', function () { undo(); });
      t.appendChild(b);
    }
    box.appendChild(t);
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { if (t.parentNode) t.remove(); }, 5000);
  }
  function announce(text) { $('toasts').setAttribute('aria-label', text); }

  $('composer').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = $('newTitle');
    var title = input.value.trim();
    if (!title) { input.focus(); return; }
    var first = tasks.length ? tasks[0].order : 0;
    col.add({ title: title.slice(0, 140), done: false, prio: $('newPrio').value, due: $('newDue').value, order: first - 1 }).catch(fail);
    input.value = ''; $('newPrio').value = ''; $('newDue').value = '';
    if (filter === 'done') setFilter('all');
    input.focus();
  });

  function setFilter(f) {
    filter = f;
    document.querySelectorAll('[data-filter]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.filter === f)); });
    render();
  }
  document.querySelectorAll('[data-filter]').forEach(function (b) {
    b.addEventListener('click', function () { setFilter(b.dataset.filter); });
  });
  $('clearDone').addEventListener('click', clearCompleted);

  // ── Phone: the All / Today / Upcoming views and the task sheet ──
  document.querySelectorAll('[data-view]').forEach(function (b) {
    b.addEventListener('click', function () {
      view = b.dataset.view;
      document.querySelectorAll('[data-view]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      render();
    });
  });
  var sheet = $('sheet');
  function openSheet(t) {
    sheetTask = t || null;
    $('sheetTitle').textContent = t ? 'Edit task' : 'New task';
    $('sheetSave').textContent = t ? 'Save' : 'Add task';
    $('sheetDelete').hidden = !t;
    $('sTitle').value = t ? t.title : '';
    $('sDue').value = t ? t.due : (view === 'today' ? iso(0) : view === 'upcoming' ? iso(1) : '');
    $('sTime').value = t ? t.time : '';
    $('sPrio').value = t ? t.prio : '';
    $('sCat').value = t ? t.cat : '';
    if (sheet.showModal) sheet.showModal(); else sheet.setAttribute('open', '');
    $('sTitle').focus();
  }
  function closeSheet() { if (sheet.open) sheet.close(); }
  $('addRow').addEventListener('click', function () { openSheet(null); });
  $('sheetClose').addEventListener('click', closeSheet);
  sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });
  $('sheetDelete').addEventListener('click', function () { if (sheetTask) remove(sheetTask.id); closeSheet(); });
  // A field low in the sheet scrolls into view once the keyboard is up.
  sheet.addEventListener('focusin', function (e) {
    setTimeout(function () { if (e.target.scrollIntoView) e.target.scrollIntoView({ block: 'center' }); }, 300);
  });
  $('sheetForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var title = $('sTitle').value.trim();
    if (!title) { $('sTitle').focus(); return; }
    var fields = { title: title.slice(0, 140), prio: $('sPrio').value, due: $('sDue').value, time: $('sTime').value, cat: $('sCat').value };
    if (sheetTask) col.update(sheetTask.id, fields).catch(fail);
    else {
      var first = tasks.length ? tasks[0].order : 0;
      fields.done = false; fields.order = first - 1;
      col.add(fields).catch(fail);
    }
    closeSheet();
  });
  phone.addEventListener ? phone.addEventListener('change', render) : phone.addListener(render);

  document.addEventListener('keydown', function (e) {
    var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement && document.activeElement.tagName);
    if (e.key === '/' && !typing) { e.preventDefault(); $('newTitle').focus(); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing && undoStack.length) { e.preventDefault(); undo(); }
  });

  var now = new Date();
  $('today').textContent = new Intl.DateTimeFormat('en-IN', { weekday: 'long', day: 'numeric', month: 'long' }).format(now);
  render();
  col.subscribe(function (list) {
    tasks = list.map(fromRecord).sort(function (a, b) { return a.order - b.order; });
    render();
  });
  db.me().then(function (me) { if (me && me.canAdd === false) { $('composer').hidden = true; $('addRow').hidden = true; } });
  if (!phone.matches) $('newTitle').focus({ preventScroll: true });
})();
</script>
</body>
</html>
