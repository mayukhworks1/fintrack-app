name: Deploy Backend → Koyeb

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Koyeb Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check secret is configured
        run: |
          if [ -z "${{ secrets.KOYEB_API_TOKEN }}" ]; then
            echo "⚠️  KOYEB_API_TOKEN not set yet — skipping deploy."
            exit 0
          fi
          echo "Secret found, proceeding."

      - name: Install Koyeb CLI
        if: ${{ secrets.KOYEB_API_TOKEN != '' }}
        run: curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh

      - name: Deploy to Koyeb
        if: ${{ secrets.KOYEB_API_TOKEN != '' }}
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
        run: |
          koyeb service redeploy fintrack/api
          echo "✅ Deploy triggered on Koyeb"
