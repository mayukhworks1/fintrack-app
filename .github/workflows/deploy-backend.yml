name: Deploy Backend → Hugging Face Spaces
# The commit a run deploys goes in its title; a later run reads it back to see
# what is already live (the "changes" step). Keep the 40-hex SHA at the end.
run-name: Deploy backend ${{ github.event.workflow_run.head_sha || github.sha }}

# Deploys only a commit that CI passed. This used to run on every push to main
# that touched backend/**, in parallel with CI, so a commit that failed its
# tests, or did not even import, was live before CI reported. It now starts
# when the "CI" workflow completes for main, goes ahead only if that run was a
# push and succeeded, and deploys exactly the commit CI tested.
#
# workflow_run has no `paths:` filter, so the old one (backend/** or this
# file) is applied by the "changes" step instead. It compares against the
# commit of the last successful deploy rather than the previous push, so a
# backend change whose CI failed, or whose deploy was cancelled or failed, is
# deployed by the next green run instead of being skipped for good. A manual
# run always deploys, and only from main: there is one production Space.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # the "changes" step lists this workflow's earlier runs

# One deploy at a time, and a running one is never cancelled: every green CI
# run starts this workflow, and one with nothing to deploy must not abort one
# that is mid-push.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Push to HF Space
    # `branches` above matches the head branch by name only, and a pull
    # request from a fork can name its branch "main" too. The event and the
    # repository are checked as well, or a fork's code could be deployed.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # Promote secret to env so step-level `if:` can reference it.
    # (GitHub forbids `secrets.*` inside `if:` conditions.)
    env:
      HAS_HF_TOKEN: ${{ secrets.HF_TOKEN != '' }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          lfs: true

      - name: Check secret is configured
        run: |
          if [ "$HAS_HF_TOKEN" != "true" ]; then
            echo "⚠️  HF_TOKEN not set yet — skipping deploy."
            echo "Add it: GitHub repo → Settings → Secrets → Actions → New secret"
            exit 0
          fi
          echo "✅ HF_TOKEN found, deploying..."

      - name: Did backend/ change since the last deploy?
        id: changes
        if: github.event_name == 'workflow_run' && env.HAS_HF_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STEP: Push backend to Hugging Face Space
        run: |
          # What the Space runs is the commit in the title of the newest run
          # whose push step succeeded. Anything unexpected — no such run yet,
          # an API error, a commit no longer in history — deploys, which is
          # what this workflow always did before it waited for CI.
          base=""
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-backend.yml/runs?status=success&per_page=50" \
                   --jq '.workflow_runs[] | [.id, .display_title] | @tsv') || runs=""
          while IFS=$'\t' read -r id title; do
            sha=$(printf '%s\n' "$title" | sed -n 's/^Deploy backend \([0-9a-f]\{40\}\)$/\1/p')
            [ -n "$sha" ] || continue
            pushed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs" \
                       --jq ".jobs[].steps[]? | select(.name == \"${DEPLOY_STEP}\") | .conclusion") || continue
            if [ "$pushed" = "success" ]; then base="$sha"; break; fi
          done <<< "$runs"

          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null &&
             git diff --quiet "$base" "$DEPLOY_SHA" -- backend .github/workflows/deploy-backend.yml; then
            echo "backend/ is unchanged since ${base}, which is already live — nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "Deploying ${DEPLOY_SHA} (last deployed: ${base:-unknown})."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push backend to Hugging Face Space
        if: env.HAS_HF_TOKEN == 'true' && steps.changes.outputs.deploy != 'false'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd backend
          git init
          git config user.email "ci@fintrack"
          git config user.name "FinTrack CI"
          git add .
          git commit -m "deploy: ${DEPLOY_SHA}" || echo "No backend changes to commit"
          git push --force \
            "https://Mayukhj24:${HF_TOKEN}@huggingface.co/spaces/Mayukhj24/fintrack-api" \
            HEAD:main
          echo "✅ Deployed to https://mayukhj24-fintrack-api.hf.space"
