name: Deploy Backend → Hugging Face Spaces

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Push to HF Space
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Check secret is configured
        run: |
          if [ -z "${{ secrets.HF_TOKEN }}" ]; then
            echo "⚠️  HF_TOKEN not set yet — skipping deploy."
            echo "Add it: GitHub repo → Settings → Secrets → Actions → New secret"
            exit 0
          fi
          echo "✅ HF_TOKEN found, deploying..."

      - name: Push backend to Hugging Face Space
        if: ${{ secrets.HF_TOKEN != '' }}
        run: |
          cd backend
          git init
          git config user.email "ci@fintrack"
          git config user.name "FinTrack CI"
          git add .
          git commit -m "deploy: $(date +'%Y-%m-%d %H:%M')"
          git push --force \
            https://mayukhworks1:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/mayukhworks1/fintrack-api \
            HEAD:main
          echo "✅ Deployed to https://mayukhworks1-fintrack-api.hf.space"
