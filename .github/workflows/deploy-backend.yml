name: Deploy Backend → Render

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy hook
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            -H "Content-Type: application/json" \
            --fail-with-body
          echo "Deploy triggered successfully"

      - name: Wait for deploy to start
        run: sleep 10

      - name: Smoke test (health check)
        run: |
          echo "Waiting 90s for Render to spin up..."
          sleep 90
          curl --fail --retry 5 --retry-delay 15 \
            "${{ secrets.VITE_API_URL }}/health" \
            && echo "✅ Backend is healthy" \
            || echo "⚠️  Health check failed (Render free tier may still be booting)"
